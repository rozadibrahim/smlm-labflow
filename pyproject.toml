[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smlm-labflow"
version = "0.3.0"
description = "Reproducible orchestration and benchmarking for single-molecule localization microscopy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "TBD" }
authors = [{ name = "Rozad Ibrahim" }]
keywords = ["SMLM", "super-resolution", "microscopy", "localization", "snakemake"]

# Light core only. Heavy, conflicting tools (LiteLoc/torch, MAGIK/TF, DeepTRACE,
# Julia) are isolated per method via the registry's runtime field, not installed
# here.
dependencies = [
    "click>=8",
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "snakemake>=8,<9",
]

# Light, in-process backends that are dependency-compatible with the core and
# live in the labflow env (no isolation needed). Heavy/conflicting tools
# (torch/TF/Java/MATLAB) get their own environments - see docs/environments.md.
[project.optional-dependencies]
cluster = ["scikit-learn>=1.3"]            # DBSCAN/OPTICS/HDBSCAN
track   = ["trackpy"]                      # trackpy linking
stats   = ["scikit-learn>=1.3", "scipy", "locan", "tifffile"]  # spatial_stats/metrics/render
ml      = ["xgboost", "lightgbm"]          # qc_audit classifiers
gui     = ["napari[all]"]                  # review / --gui (needs a display)
light   = ["scikit-learn>=1.3", "trackpy", "scipy", "locan", "xgboost", "lightgbm", "tifffile"]
spline  = ["scipy"]
dev     = ["pytest"]

[project.scripts]
labflow = "labflow.cli:main"

[tool.setuptools]
packages = ["labflow", "labflow.stages", "driftcorr"]
