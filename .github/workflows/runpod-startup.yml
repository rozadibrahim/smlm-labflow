name: Test and publish RunPod startup candidate

on:
  push:
    branches: ['codex/runpod-*']
    paths:
      - '.github/workflows/runpod-startup.yml'
      - 'docker/runpod/Dockerfile.startup'
      - 'docker/runpod/start.sh'
      - 'scripts/runpod_smoke_test.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:runpod-startup-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod/Dockerfile.startup
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}
      - name: Verify default and injected startup commands, SSH, storage and demo
        run: bash scripts/runpod_smoke_test.sh '${{ steps.image.outputs.name }}'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish startup candidate
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE"
          candidate="${IMAGE%%:runpod-*}:runpod-startup-fix"
          docker tag "$IMAGE" "$candidate"
          docker push "$candidate"
          echo "Startup candidate: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Alias: \`$candidate\`" >> "$GITHUB_STEP_SUMMARY"
