name: build-tool-images

# Build each tool's Docker image once, in CI, and publish to GHCR so labs just
# `labflow install <tool>` (a one-line pull) — no dependency resolution on their
# machine. Add a tool by creating docker/<tool>/Dockerfile and listing it below.

on:
  push:
    tags: ["v*"]            # publish on release tags
  workflow_dispatch:        # or trigger manually
    inputs:
      tool:
        description: "Single tool to build (blank = all in the matrix)"
        required: false

permissions:
  contents: read
  packages: write           # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [cellpose, stardist, microsam, omnipose, magik, trackmate, deeptrace, deepspt]   # add more as docker/<tool>/ exist
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a single tool was requested and it isn't this one
        id: gate
        run: |
          want="${{ github.event.inputs.tool }}"
          if [ -n "$want" ] && [ "$want" != "${{ matrix.tool }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space (large CUDA/conda images)
        if: steps.gate.outputs.skip != 'true' && contains(fromJSON('["magik","deeptrace","deepspt","microsam"]'), matrix.tool)
        run: |
          echo "disk before:"; df -h /
          # reclaim ~28 GB of preinstalled tooling the image build does not need
          # (android ~12 GB, hostedtoolcache ~10 GB, dotnet, ghc, boost)
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/az
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Set up Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.tool }}
          push: true
          # Tagged AND digest-pinned; pin methods.yaml to the @sha256 for reproducibility.
          tags: |
            ghcr.io/${{ github.repository_owner }}/smlm-${{ matrix.tool }}:latest
            ghcr.io/${{ github.repository_owner }}/smlm-${{ matrix.tool }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
